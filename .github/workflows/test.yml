# This workflow will build the main SET application and publish it to GitHub Packages
name: Test

on:
  pull_request:
    paths:
      - '**/java/**'
      - 'web/siteplan/**'
      - 'web/textviewer/**'
  push:
    tags:
      - 'v**'
    branches:
      - 'release/**'
      - 'main'
# Enable concurrency to avoid multiple builds at the same time
concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  typecheck-siteplan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci
        working-directory: web/siteplan

      - name: Run typecheck
        run: npm run typecheck
        working-directory: web/siteplan

  test-siteplan:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci
        working-directory: web/siteplan

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: web/siteplan

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/siteplan/playwright-report/
          retention-days: 1

  test-table-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      checks: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Java
        uses: eclipse-set/build/.github/actions/setup-java@main
      
      - name: Run Tests
        run: | 
          mvn ${{ env.MVN_FLAGS }} -f java/pom.xml verify \
            -Dtycho.source.skip=true \
            -DskipP2Metadata=true \
            -Dosgi-test=true \
            # Skip normal integration test
            -DskipTests
            -Dmaven.javadoc.skip=true
      
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: |
            ${{ github.workspace }}/**/surefire-reports/*.xml
    
